[package]
name = "imgui-tutorial"
version = "0.1.0"
edition = "2024"

[dependencies]
# The application runner — bundles Winit + WGPU + ImGui
dear-app = { version = "0.15", features = ["imnodes"] }

# Core ImGui bindings — 0.15.x does not re-export imgui from dear-app,
# so you need this as an explicit dependency for types like Condition.
dear-imgui-rs = "0.15"

# ImNodes — the node editor extension for Dear ImGui
dear-imnodes = "0.15"

# Serialization for application state
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Structured logging
tracing = "0.1"
tracing-subscriber = "0.3"
